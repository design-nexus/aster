name: Aster
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - name: Install Starship for preview tests
        env:
          STARSHIP_VERSION: v1.26.0
        run: |
          curl --fail --location --retry 3 "https://github.com/starship/starship/releases/download/${STARSHIP_VERSION}/starship-x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/starship.tar.gz"
          tar -xzf "$RUNNER_TEMP/starship.tar.gz" -C "$RUNNER_TEMP" starship
          "$RUNNER_TEMP/starship" --version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python3 tests/terminal.py target/release/aster
