[package]
name = "aster"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/design-nexus/aster"
description = "Wizard and editor for the Starship prompt"
license = "MIT"
readme = "README.md"

[dependencies]
ansi-to-tui = "8"
anyhow = "1.0.104"
crossterm = "0.29"
dirs = "7.0.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
toml_edit = "0.25.15"

tempfile = "3"
unicode-width = "0.2"
libc = "0.2"
similar = "2"
signal-hook = "0.3"
