# Aster original: Obsidian
# Dark-terminal palette. Powerline variants require a Nerd Font.
add_newline = true
format = """[▪](bold #a4afbd) $directory$git_branch$git_status
[└](#778899) $character"""
right_format = '$cmd_duration$time'

[directory]
style = 'bold #a4afbd'
format = '[ $path ]($style)'
truncation_length = 3
truncate_to_repo = true
read_only = ' '

[git_branch]
style = 'bold #778899'
symbol = ' '
format = '[ $symbol$branch ]($style)'

[git_status]
style = 'bold #778899'
format = '([ $all_status$ahead_behind ]($style))'
conflicted = '!'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↕'
untracked = '?'
stashed = '≡'
modified = '~'
staged = '+'
renamed = '»'
deleted = '×'

[character]
success_symbol = '[❯](bold #a4afbd)'
error_symbol = '[×](bold #e78284)'
vimcmd_symbol = '[❮](bold #778899)'

[cmd_duration]
min_time = 2000
style = '#c9d1d9'
format = '[ $duration ]($style)'

[time]
disabled = false
time_format = '%H:%M'
style = '#778899'
format = '[ $time ]($style)'

[fill]
symbol = ' '

[jobs]
style = '#c9d1d9'
symbol = '⋮ '
format = '[ $symbol$number ]($style)'
